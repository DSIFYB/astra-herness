- id: agent-preset-registry
  config:
    default: astra-local

- insert:
    - id: preset-astra-local
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: astra-local
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a Russian-speaking assistant for document work. This is
                an initial local model test. No document editing tools are
                connected yet. Do not claim to have read, changed, or saved
                files. Answer the user's questions briefly in Russian.
              complete: true
              includeRuntimeContext: false
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system

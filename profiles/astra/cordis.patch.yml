- id: agent-default-model
  config:
    provider: local-qwen
    model: !!js process.env.ASTRA_MODEL_SLUG || 'qwen3.5-2b'

- id: llm-pi-ai
  config:
    providers:
      local-qwen:
        displayName: !!js process.env.ASTRA_MODEL_DISPLAY_NAME || 'Qwen3.5-2B Local'
        apiKeyEnv: ASTRA_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8081/v1
        defaultContextWindow: 8192
        defaultMaxTokens: 512
        retryPolicy:
          mode: normal
          maxRetries: 1
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.ASTRA_MODEL_SLUG || 'qwen3.5-2b'
            name: !!js process.env.ASTRA_MODEL_DISPLAY_NAME || 'Qwen3.5-2B Local'
            contextWindow: 8192
            maxTokens: 512
            input: [ text ]
            reasoningEfforts: false

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.ASTRA_WORKSPACE_ROOT

- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.ASTRA_WORKSPACE_ROOT

- id: agent-loop
  config:
    maxParallelToolCalls: 1
    agents: []

